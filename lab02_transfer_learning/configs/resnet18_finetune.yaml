experiment:
  name: resnet18_finetune
  purpose: >
    Fine-tune khối convolution cuối của ResNet18 đã được huấn luyện trước trên
    ImageNet cho bài toán phân loại FashionMNIST.
  hypothesis: >
    Mở khóa khối cuối của ResNet18 sẽ giúp mô hình thích nghi tốt hơn với
    FashionMNIST trong khi vẫn tận dụng các đặc trưng hình ảnh pretrained.
  changed_from_baseline: >
    Bắt đầu từ ResNet18 pretrained baseline đã đóng băng, sau đó mở khóa layer4 và
    fc, đồng thời giảm learning rate để fine-tune khối đặc trưng cuối và classifier.
  kept_constant: >
    Giữ nguyên tập dữ liệu, kích thước ảnh, chuẩn hóa ImageNet, batch size, seed và
    quy trình đánh giá như ResNet18 pretrained baseline.
  expected_observation: >
    Fine-tuning được kỳ vọng cải thiện validation accuracy so với baseline chỉ
    huấn luyện classifier, nhưng có thể overfit nhanh hơn nếu train quá nhiều epoch.

model:
  name: resnet18
  source: torchvision.models
  pretrained: true
  weights: IMAGENET1K_V1
  num_classes: 10

transfer_learning:
  freeze_backbone: false
  train_classifier_only: false
  unfreeze_layers: ["layer4", "fc"]

training:
  epochs: 5
  batch_size: 32
  learning_rate: 0.0001
  optimizer: adam

data:
  validation_ratio: 0.1
  augmentation: true
  image_size: 224
  input_channels: 3
  normalization: imagenet

tensorboard:
  enabled: true
  log_dir: tensorboard

seed: 42
