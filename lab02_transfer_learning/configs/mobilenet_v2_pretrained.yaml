experiment:
  name: mobilenet_v2_pretrained
  purpose: >
    Thử nghiệm MobileNetV2 gọn nhẹ đã được huấn luyện trước trên ImageNet cho bài
    toán transfer learning với FashionMNIST.
  hypothesis: >
    MobileNetV2 sẽ huấn luyện nhanh hơn các kiến trúc nặng hơn nhưng vẫn đạt
    validation accuracy tốt nhờ các đặc trưng đã học từ ImageNet.
  changed_from_baseline: >
    Sử dụng trọng số pretrained của torchvision.models.mobilenet_v2, thay lớp
    classifier bằng đầu ra 10 lớp và đóng băng bộ trích xuất đặc trưng.
  kept_constant: >
    Giữ nguyên cách chia FashionMNIST, seed, tiền xử lý ảnh 224x224 với 3 kênh và
    quy trình đánh giá như các thí nghiệm pretrained khác.
  expected_observation: >
    MobileNetV2 được kỳ vọng tạo ra sự cân bằng tốt giữa tốc độ và độ chính xác,
    đặc biệt khi chạy trên CPU.

model:
  name: mobilenet_v2
  source: torchvision.models
  pretrained: true
  weights: IMAGENET1K_V1
  num_classes: 10

transfer_learning:
  freeze_backbone: true
  train_classifier_only: true
  unfreeze_layers: []

training:
  epochs: 5
  batch_size: 32
  learning_rate: 0.001
  optimizer: adam

data:
  validation_ratio: 0.1
  augmentation: false
  image_size: 224
  input_channels: 3
  normalization: imagenet

tensorboard:
  enabled: true
  log_dir: tensorboard

seed: 42
