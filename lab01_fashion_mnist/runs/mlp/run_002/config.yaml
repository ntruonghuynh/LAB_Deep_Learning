experiment:
  name: mlp_baseline
  purpose: "Thi\u1EBFt l\u1EADp m\u1ED9t m\xF4 h\xECnh c\u01A1 s\u1EDF fully-connected\
    \ \u0111\u01A1n gi\u1EA3n cho b\xE0i to\xE1n ph\xE2n lo\u1EA1i FashionMNIST, \u0111\
    \u1EC3 so s\xE1nh v\u1EDBi CNN baseline.\n"
  hypothesis: "M\u1ED9t MLP v\u1EDBi 2 l\u1EDBp \u1EA9n s\u1EBD \u0111\u1EA1t \u0111\
    \u1ED9 ch\xEDnh x\xE1c ch\u1EA5p nh\u1EADn \u0111\u01B0\u1EE3c nh\u01B0ng k\xE9\
    m h\u01A1n CNN, v\xEC n\xF3 b\u1ECF qua c\u1EA5u tr\xFAc kh\xF4ng gian 2D trong\
    \ \u1EA3nh.\n"
  changed_from_baseline: "kh\xF4ng \xE1p d\u1EE5ng - \u0111\xE2y l\xE0 l\u1EA7n ch\u1EA1\
    y baseline \u0111\u1EA7u ti\xEAn"
  kept_constant: "kh\xF4ng \xE1p d\u1EE5ng - \u0111\xE2y l\xE0 l\u1EA7n ch\u1EA1y\
    \ baseline \u0111\u1EA7u ti\xEAn"
  expected_observation: "Validation accuracy th\u1EA5p h\u01A1n r\xF5 r\u1EC7t so\
    \ v\u1EDBi CNN baseline, v\u1EDBi kho\u1EA3ng c\xE1ch train/validation \u1EDF\
    \ m\u1EE9c v\u1EEBa ph\u1EA3i t\xF9y v\xE0o dropout.\n"
model:
  name: mlp
  hidden_sizes:
  - 256
  - 128
  dropout: 0.2
training:
  epochs: 15
  batch_size: 64
  learning_rate: 0.001
  optimizer: adam
data:
  validation_ratio: 0.1
  augmentation: false
seed: 42
