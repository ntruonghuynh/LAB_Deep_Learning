experiment:
  name: mlp_baseline
  purpose: 'Establish a simple fully-connected baseline for FashionMNIST classification,
    to be compared against the CNN baseline.

    '
  hypothesis: 'A 2-hidden-layer MLP should reach reasonable accuracy but underperform
    a CNN, since it ignores 2D spatial structure in the images.

    '
  changed_from_baseline: n/a - this is the first baseline run
  kept_constant: n/a - this is the first baseline run
  expected_observation: 'Validation accuracy noticeably lower than the CNN baseline,
    with a moderate train/validation gap depending on dropout.

    '
model:
  name: mlp
  hidden_sizes:
  - 256
  - 128
  dropout: 0.2
training:
  epochs: 15
  batch_size: 64
  learning_rate: 0.001
  optimizer: adam
data:
  validation_ratio: 0.1
  augmentation: false
seed: 42
